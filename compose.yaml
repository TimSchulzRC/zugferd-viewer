# Production stack, written for Coolify (build pack "Docker Compose").
# No service publishes a port. Coolify's proxy reaches `web` on 3000 through the Docker network,
# and the services reach each other by name. S3 and mail are external and come in as variables.
#
# SERVICE_* variables are generated by Coolify: the public URL from the domain set in the UI,
# the database password and the auth secret once at creation.
services:
  web:
    build: .
    restart: unless-stopped
    environment:
      - SERVICE_URL_WEB_3000
      - APP_URL=${SERVICE_URL_WEB}
      - BETTER_AUTH_SECRET=${SERVICE_BASE64_64_AUTH}
      - DATABASE_URL=postgres://zugferd:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/zugferd
      - VALIDATOR_URL=http://validator:8080
      - ADMIN_EMAIL=${ADMIN_EMAIL:?}
      - S3_ENDPOINT=${S3_ENDPOINT:?}
      - S3_BUCKET=${S3_BUCKET:?}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:?}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:?}
      - S3_REGION=${S3_REGION:-us-east-1}
      - LETTERMINT_TOKEN=${LETTERMINT_TOKEN:?}
      - MAIL_FROM=${MAIL_FROM:?}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      validator:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/config').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  validator:
    build: ./validator
    restart: unless-stopped
    environment:
      # Caps the JVM so it cannot take a quarter of the host's memory, its default.
      - JAVA_TOOL_OPTIONS=-Xmx768m
    expose:
      - "8080"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=zugferd
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=zugferd
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zugferd -d zugferd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
